name: Deploy to Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      environment: staging
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging

    env:
      REGISTRY: ghcr.io
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH over cloudflared tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USERNAME }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

      - name: Deploy to server
        run: |
          ssh -T ${{ secrets.SERVER_HOST }} << ENDSSH
            cd ${{ env.DEPLOY_PATH }}
            cat > .env <<'EOF'
          DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          TURNSTILE_SITE_KEY=${{ env.TURNSTILE_SITE_KEY }}
          EOF
            docker compose down
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            docker compose up -d
          ENDSSH
